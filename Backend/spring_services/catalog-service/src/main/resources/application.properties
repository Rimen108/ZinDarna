
spring.application.name=catalog-service

server.port=8082


# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/catalog_db

# Auth Profile Service - Sara
auth-profile-service.base-url=http://localhost:8084

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Keycloak - JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/zin-darna

# Spring Security Logs (Development)
logging.level.org.springframework.security=DEBUG
