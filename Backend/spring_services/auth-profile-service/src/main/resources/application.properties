# Application
spring.application.name=auth-profile-service
server.port=8084

# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/auth_db
spring.mongodb.auto-index-creation=true

# Config Server
spring.config.import=optional:configserver:http://localhost:9999


# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Keycloak - JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/zin-darna


