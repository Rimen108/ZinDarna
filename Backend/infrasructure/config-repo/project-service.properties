# Project Service Configuration
server.port=8083

# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/project_db
spring.mongodb.database=project_db

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Keycloak - JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/zin-darna